[project]
name = "ggdown-engine"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gallery-dl==1.32.10",
    "pysocks>=1.7.1,<2",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "curl-cffi>=0.16.2",
    "emoji>=2.15.0",
    "fastapi>=0.141.1",
    "javascript>=1!1.2.6",
    "lxml>=6.1.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10"]
